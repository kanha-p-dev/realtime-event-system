# docker-compose.yml — ใช้ทดสอบ local ก่อน deploy ขึ้น Azure
# รัน: docker compose up --build
# หยุด: docker compose down

services:
  backend-service:
    build:
      context: ./backend-service
    container_name: backend-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-realtime_event_system}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/items"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  websocket-gateway-service:
    build:
      context: ./websocket-gateway-service
    container_name: websocket-gateway-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI}
    restart: unless-stopped
    depends_on:
      backend-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection(3001,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
