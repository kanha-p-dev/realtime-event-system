name: CD Staging (Azure Container Apps)

# รันอัตโนมัติเมื่อ push เข้า main และกดรันมือได้
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # จำกัดให้มี staging deploy ต่อครั้งเดียว
  group: cd-staging
  cancel-in-progress: true

env:
  # ดึงค่าปลายทางจาก GitHub Secrets
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP_STAGING }}
  BACKEND_APP_NAME: ${{ secrets.AZURE_BACKEND_APP_NAME_STAGING }}
  WEBSOCKET_APP_NAME: ${{ secrets.AZURE_WEBSOCKET_APP_NAME_STAGING }}

jobs:
  # ตรวจว่า service ใดควรถูก deploy ในรอบนี้
  detect-changes:
    name: Detect Deployable Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # ถ้ามีการแก้ service หรือ compose จะถือว่าต้อง deploy
          filters: |
            backend:
              - 'backend-service/**'
              - 'docker-compose.yml'
            gateway:
              - 'websocket-gateway-service/**'
              - 'docker-compose.yml'

  build-backend:
    name: Build and Push Backend (Staging)
    runs-on: ubuntu-latest
    needs: detect-changes
    # ข้าม job นี้ถ้า backend ไม่ได้เปลี่ยน
    if: needs.detect-changes.outputs.backend == 'true'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set Image Tag
        id: meta
        run: echo "tag=${{ env.AZURE_CONTAINER_REGISTRY }}/backend-service:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        run: |
          docker build -t ${{ steps.meta.outputs.tag }} ./backend-service
          docker push ${{ steps.meta.outputs.tag }}

  build-gateway:
    name: Build and Push Gateway (Staging)
    runs-on: ubuntu-latest
    needs: detect-changes
    # ข้าม job นี้ถ้า gateway ไม่ได้เปลี่ยน
    if: needs.detect-changes.outputs.gateway == 'true'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set Image Tag
        id: meta
        run: echo "tag=${{ env.AZURE_CONTAINER_REGISTRY }}/websocket-gateway-service:staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        run: |
          docker build -t ${{ steps.meta.outputs.tag }} ./websocket-gateway-service
          docker push ${{ steps.meta.outputs.tag }}

  deploy-backend:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    needs: build-backend
    # deploy ต่อเมื่อ build backend สำเร็จเท่านั้น
    if: needs.build-backend.result == 'success'
    environment: staging
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Deploy Backend Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP_NAME }}
          imageToDeploy: ${{ needs.build-backend.outputs.image-tag }}
          environmentVariables: |
            NODE_ENV=production
            PORT=3000
            MONGODB_URI=secretref:mongodb-uri
            MONGODB_DB_NAME=secretref:mongodb-db-name

  deploy-gateway:
    name: Deploy Gateway (Staging)
    runs-on: ubuntu-latest
    needs: build-gateway
    # deploy ต่อเมื่อ build gateway สำเร็จเท่านั้น
    if: needs.build-gateway.result == 'success'
    environment: staging
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Deploy Gateway Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.WEBSOCKET_APP_NAME }}
          imageToDeploy: ${{ needs.build-gateway.outputs.image-tag }}
          environmentVariables: |
            NODE_ENV=production
            PORT=3001
            MONGODB_URI=secretref:mongodb-uri
