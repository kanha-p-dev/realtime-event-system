name: Deploy to Azure Container Apps

on:
  workflow_call:

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}   # e.g. myacr.azurecr.io
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  BACKEND_APP_NAME: backend-service
  WEBSOCKET_APP_NAME: websocket-gateway-service
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build & push backend-service
  # ─────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build backend-service (prod)
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tag
        id: meta
        run: echo "tags=${{ env.AZURE_CONTAINER_REGISTRY }}/backend-service:${{ env.RELEASE_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend-service image
        run: |
          docker build -t ${{ steps.meta.outputs.tags }} ./backend-service
          docker push ${{ steps.meta.outputs.tags }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build & push websocket-gateway-service
  # ─────────────────────────────────────────────────────────────────────────
  build-websocket:
    name: Build websocket-gateway-service (prod)
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tag
        id: meta
        run: echo "tags=${{ env.AZURE_CONTAINER_REGISTRY }}/websocket-gateway-service:${{ env.RELEASE_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Build and push websocket-gateway-service image
        run: |
          docker build -t ${{ steps.meta.outputs.tags }} ./websocket-gateway-service
          docker push ${{ steps.meta.outputs.tags }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy backend-service to Azure Container Apps
  # ─────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend-service (prod)
    runs-on: ubuntu-latest
    needs: build-backend
    environment: production
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP_NAME }}
          imageToDeploy: ${{ needs.build-backend.outputs.image-tag }}
          environmentVariables: |
            NODE_ENV=production
            PORT=3000
            MONGODB_URI=secretref:mongodb-uri
            MONGODB_DB_NAME=secretref:mongodb-db-name

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy websocket-gateway-service to Azure Container Apps
  # ─────────────────────────────────────────────────────────────────────────
  deploy-websocket:
    name: Deploy websocket-gateway-service (prod)
    runs-on: ubuntu-latest
    needs: build-websocket
    environment: production
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy websocket-gateway-service to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.WEBSOCKET_APP_NAME }}
          imageToDeploy: ${{ needs.build-websocket.outputs.image-tag }}
          environmentVariables: |
            NODE_ENV=production
            PORT=3001
            MONGODB_URI=secretref:mongodb-uri
